name: Lint

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Hard gate: fatal/static errors only (config in backend/pyproject.toml)
      - name: Ruff check (E9,F63,F7,F82)
        run: ruff check app tests

  black:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until legacy code is formatted (ROADMAP 3.2)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install black
        run: pip install black

      - name: Black check
        run: black --check app tests
